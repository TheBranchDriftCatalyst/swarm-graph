volumes:
  dummy-data:

networks:
  traefik-public:
    driver: bridge

services:
  dummy:
    image: alpine:latest
    command: 
      - sh
      - -c
      - |
        while true; do
          echo "Dummy container to hold volume"
          sleep 3600
        done
    volumes:
      - dummy-data:/data
    deploy:
      replicas: 3
    networks:
      - traefik-public
    labels:
      - "traefik.enable=false"

  whoami:
    image: traefik/whoami
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whoami.rule=Host(`whoami.localhost`)"
      - "traefik.http.routers.whoami.entrypoints=web"
      - "traefik.http.services.whoami.loadbalancer.server.port=80"

  traefik:
    image: traefik
    container_name: traefik-dev
    command:
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.endpoint=unix:///var/run/docker.sock
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --log.level=DEBUG
    ports:
      - "80:80"
      - "8080:8080" # traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - traefik-public
    restart: unless-stopped
  
  frontend:
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`frontend.localhost`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=5173"
    depends_on: [traefik]

  backend:
    networks:
      - traefik-public
    depends_on: [traefik]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.agent.rule=Host(`agent.localhost`)"
      - "traefik.http.routers.agent.entrypoints=web"
      - "traefik.http.services.agent.loadbalancer.server.port=9123"
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.agent.rule=Host(`agent.localhost`)"
        - "traefik.http.routers.agent.entrypoints=web"
        - "traefik.http.services.agent.loadbalancer.server.port=9123"
  kroki:
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kroki.rule=Host(`kroki.localhost`)"
      - "traefik.http.routers.kroki.entrypoints=web"
      - "traefik.http.services.kroki.loadbalancer.server.port=8000"
    depends_on: [traefik]