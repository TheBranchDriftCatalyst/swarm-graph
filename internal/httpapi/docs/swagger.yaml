basePath: /
host: localhost:8080
info:
  contact:
    email: dev@example.com
    name: Catalyst Dev
  description: API for rendering swarm graphs and inspecting docker resources.
  title: Swarm Graph API
  version: 0.0.0
paths:
  /docker/inspect:
    get:
      parameters:
      - description: docker resource id or name
        in: query
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
      summary: Inspect Docker resource
  /graph.json:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Graph JSON snapshot
  /graph.mmd:
    get:
      description: Return raw Mermaid diagram source (text/plain) with optional query
        filters
      parameters:
      - description: Filter by stack attribute
        in: query
        name: stack
        type: string
      - description: Exclude nodes with zero degree (1/true)
        in: query
        name: exclude_orphans
        type: string
      - description: Comma-separated kinds to include (container,image,network,volume)
        in: query
        name: kinds
        type: string
      - description: Layout direction (LR, RL, TB, BT)
        in: query
        name: dir
        type: string
      - description: Name substring filter (case-insensitive)
        in: query
        name: name
        type: string
      - description: Minimum incident edges to include node
        in: query
        name: min_degree
        type: integer
      - description: Comma-separated kinds to exclude
        in: query
        name: exclude_kinds
        type: string
      - description: Append short IDs to labels (1/true)
        in: query
        name: show_ids
        type: string
      - description: Truncate labels to this many runes (0 disables)
        in: query
        name: max_label_runes
        type: integer
      - description: Group nodes by this attribute into subgraphs
        in: query
        name: group_by
        type: string
      - description: Theme name (synthwave/cyberpunk/neon)
        in: query
        name: theme
        type: string
      - description: Include legend in output (1/true)
        in: query
        name: include_legend
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Mermaid source
  /graph.png:
    get:
      parameters:
      - description: Filter by stack
        in: query
        name: stack
        type: string
      - description: Exclude nodes with zero degree (1/true)
        in: query
        name: exclude_orphans
        type: string
      - description: Comma-separated kinds to include (container,image,network,volume)
        in: query
        name: kinds
        type: string
      - description: Layout direction (LR, RL, TB, BT)
        in: query
        name: dir
        type: string
      - description: Name substring filter (case-insensitive)
        in: query
        name: name
        type: string
      - description: Minimum incident edges to include node
        in: query
        name: min_degree
        type: integer
      - description: Comma-separated kinds to exclude
        in: query
        name: exclude_kinds
        type: string
      - description: Append short IDs to labels (1/true)
        in: query
        name: show_ids
        type: string
      - description: Truncate labels to this many runes (0 disables)
        in: query
        name: max_label_runes
        type: integer
      - description: Group nodes by this attribute into subgraphs
        in: query
        name: group_by
        type: string
      - description: Theme name (synthwave/cyberpunk/neon)
        in: query
        name: theme
        type: string
      - description: Include legend in output (1/true)
        in: query
        name: include_legend
        type: string
      produces:
      - image/png
      responses:
        "200":
          description: OK
          schema:
            type: file
      summary: Rendered PNG
  /graph.svg:
    get:
      parameters:
      - description: Filter by stack
        in: query
        name: stack
        type: string
      - description: Exclude nodes with zero degree (1/true)
        in: query
        name: exclude_orphans
        type: string
      - description: Comma-separated kinds to include (container,image,network,volume)
        in: query
        name: kinds
        type: string
      - description: Layout direction (LR, RL, TB, BT)
        in: query
        name: dir
        type: string
      - description: Name substring filter (case-insensitive)
        in: query
        name: name
        type: string
      - description: Minimum incident edges to include node
        in: query
        name: min_degree
        type: integer
      - description: Comma-separated kinds to exclude
        in: query
        name: exclude_kinds
        type: string
      - description: Append short IDs to labels (1/true)
        in: query
        name: show_ids
        type: string
      - description: Truncate labels to this many runes (0 disables)
        in: query
        name: max_label_runes
        type: integer
      - description: Group nodes by this attribute into subgraphs
        in: query
        name: group_by
        type: string
      - description: Theme name (synthwave/cyberpunk/neon)
        in: query
        name: theme
        type: string
      - description: Include legend in output (1/true)
        in: query
        name: include_legend
        type: string
      produces:
      - image/svg+xml
      responses:
        "200":
          description: OK
          schema:
            type: file
      summary: Rendered SVG
  /health:
    get:
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Health check
swagger: "2.0"
