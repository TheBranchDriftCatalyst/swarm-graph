name: Update Docker Hub description
on:
  push:
    branches: [ main ]
    paths:
      - docker/README.md
      - .github/workflows/update-dockerhub.yml

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/swarm-graph
          readme-filepath: etc/DOCKER.md
          short-description: Real-time Docker container topology visualizer with interactive D3 UI.
