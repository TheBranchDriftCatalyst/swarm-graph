version: "3"

tasks:

  build:
    desc: Build the production Docker image
    cmds:
    - docker build -t {{ .DOCKER_BUILD_TAG }} .

  up:
    desc: Start compose (production)
    cmds:
    - docker compose up --build -d {{ .CLI_ARGS }}

  down:
    desc: Stop compose
    cmds:
    - docker compose down

  dev:up:
    desc: Start the dev compose service (mounts source and runs air)
    cmds:
    - docker compose up

  dev:down:
    desc: Stop the dev compose services
    cmds:
    - docker compose down

  compose:rebuild:
    desc: Rebuild compose images without cache and bring services up
    cmds:
    - docker compose build --no-cache
    - docker compose up -d
