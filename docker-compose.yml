volumes:
  dummy-data:
  frontend_node_modules:

services:
  backend:
    build:
      context: ./backend
      target: dev
    image: swarm-graph:dev
    volumes:
      - ./backend:/app:cached
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "9123:9123"
    environment:
      - LOG_LEVEL=DEBUG
    
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app:cached
      - frontend_node_modules:/app/node_modules

  kroki:
    image: yuzutech/kroki
    ports:
      - "8000:8000"
    