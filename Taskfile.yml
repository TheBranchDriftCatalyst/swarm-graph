version: "3"

includes:
  backend: backend/Taskfile.yml
  # This is going to be imported by our dependents
  # docker: Taskfile.docker.yml

tasks:

  frontend:install:
    desc: (helper) Install frontend dependencies using yarn
    cmds:
    - cd frontend && yarn install

  frontend:dev:
    desc: (helper) Run frontend dev server
    cmds:
    - cd frontend && yarn dev
