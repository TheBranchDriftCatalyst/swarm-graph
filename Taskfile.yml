version: "3"

includes:
  backend: backend/Taskfile.yml
  # This is going to be imported by our dependents
  # docker: Taskfile.docker.yml

tasks:

  frontend:install:
    desc: (helper) Install frontend dependencies using yarn
    cmds:
    - cd frontend && yarn install

  frontend:dev:
    desc: (helper) Run frontend dev server
    cmds:
    - cd frontend && yarn dev

  frontend:build:
    desc: Build frontend for production
    deps: [ frontend:install ]
    cmds:
    - cd frontend && yarn build

  build:
    desc: Build complete production application
    deps: [ frontend:build ]
    cmds:
    - cd backend && go build -o bin/agent ./cmd/agent

  run:production:
    desc: Run production build (requires build task to be run first)
    deps: [ build ]
    cmds:
    - cd backend && STATIC_PATH=../frontend/dist ./bin/agent

  docker:build:production:
    desc: Build production Docker image
    deps: [ build ]
    cmds:
    - docker build -f Dockerfile.production -t swarm-graph:production .

  docker:run:production:
    desc: Run production Docker container
    deps: [ docker:build:production ]
    cmds:
    - docker run -p 9123:9123 -v /var/run/docker.sock:/var/run/docker.sock swarm-graph:production

  clean:
    desc: Clean build artifacts
    cmds:
    - rm -rf frontend/dist
    - rm -f backend/bin/agent

  release:patch:
    desc: Build and release patch version (0.0.X)
    cmds:
    - ./etc/scripts/build-production.sh patch

  release:minor:
    desc: Build and release minor version (0.X.0)
    cmds:
    - ./etc/scripts/build-production.sh minor

  release:major:
    desc: Build and release major version (X.0.0)
    cmds:
    - ./etc/scripts/build-production.sh major

  release:
    desc: Build and release patch version (alias for release:patch)
    cmds:
    - ./etc/scripts/build-production.sh patch

  docker:hub:update:
    desc: Update Docker Hub repository description and README
    cmds:
    - ./etc/scripts/update-docker-hub.sh

  docker:hub:update:api:
    desc: Update Docker Hub repository via API (requires DOCKERHUB credentials)
    env:
      DOCKERHUB_ENABLE_API_UPDATE: true
    cmds:
    - ./etc/scripts/update-docker-hub.sh
